name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mbstring, pdo_sqlite

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Garantir migration da versão do módulo
        run: php scripts/ensure-version-migration.php

      - name: PHP lint
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Webhook - autenticação, configurações e contrato Asaas
        run: |
          php tests/webhook-token-smoke.php
          php tests/webhook-api-smoke.php

      - name: Envio de faturas, carregamento da SDK e diagnóstico
        run: |
          php tests/provider-autoload-smoke.php
          php tests/payment-api-smoke.php
          php tests/invoice-dispatch-smoke.php
          php tests/diagnostics-smoke.php

      - name: Consistência de faturas e recebimentos
        run: |
          php tests/payment-validation-smoke.php
          php tests/payment-lifecycle-api-smoke.php
          php tests/invoice-transaction-smoke.php
          php tests/invoice-lifecycle-smoke.php
          php tests/atomic-payment-smoke.php
          php tests/invoice-receipt-lock-smoke.php
          php tests/checkout-receipt-smoke.php

      - name: JavaScript das configurações do webhook
        run: node --check assets/js/asaas-webhook-settings.js

      - name: Configurações, monitoramento e conciliação
        run: |
          php tests/settings-environment-smoke.php
          php tests/monitor-reconciliation-smoke.php
          php tests/module-version-smoke.php
          node --check assets/js/asaas-settings.js
          node --check assets/js/asaas-monitor.js
          node tests/settings-ui-smoke.js
          node tests/monitor-ui-smoke.js

      - name: Cartão de crédito e apresentação do ambiente
        run: |
          php tests/checkout-environment-smoke.php
          php tests/card-view-smoke.php
          php tests/card-api-smoke.php
          php tests/card-checkout-smoke.php
          php tests/card-controller-smoke.php
          node --check assets/js/asaas-card-checkout.js
          node tests/card-checkout-ui-smoke.js

      - name: Validar padrão Perfex (versão + migrations)
        run: ./.github/scripts/check_perfex_module.sh

      - name: Verificar padrões proibidos
        run: |
          set -euo pipefail
          PATTERN='(/v2|codephix|sandbox\.asaas\.com/api|https://www\.asaas\.com)'
          if grep -RInE \
            --exclude-dir=vendor \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=tests \
            --exclude-dir=docs \
            "$PATTERN" .; then
            echo "Encontrado padrão proibido no código."
            exit 1
          fi

  monitoring-database:
    name: SQL e índices do monitoramento (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: integration-fixture-only
          MARIADB_DATABASE: asaas_monitor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring
      - name: Validar consultas e atualização aditiva
        env:
          ASAAS_MONITOR_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=asaas_monitor_test;charset=utf8mb4
          ASAAS_MONITOR_TEST_USER: root
          ASAAS_MONITOR_TEST_PASSWORD: integration-fixture-only
        run: php tests/monitor-mysql-smoke.php

  settings-browser:
    name: Subguias e monitoramento em Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          extensions: mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar dependências exclusivas dos testes
        run: |
          composer install --no-dev --no-scripts --prefer-dist --no-interaction
          npm install --prefix "$RUNNER_TEMP/asaas-ui" --no-audit --no-fund playwright@1.62.1 jquery@3.7.1 bootstrap@3.4.1
          "$RUNNER_TEMP/asaas-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validar interface em navegador
        run: |
          export NODE_PATH="$RUNNER_TEMP/asaas-ui/node_modules"
          node tests/settings-ui-smoke.js --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asaas-settings-browser-${{ github.sha }}
          path: tests/artifacts/settings-*.png
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Pacote candidato com SDK de produção
    needs: [tests, monitoring-database, settings-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          extensions: mbstring
      - name: Instalar dependências de produção do lock
        run: composer install --no-dev --no-scripts --prefer-dist --optimize-autoloader --no-interaction
      - name: Conferir SDK distribuída
        run: |
          php -r 'require "vendor/autoload.php"; $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if ($package["name"] === "argws/asaas-sdk-php") { $expected = $package["source"]["reference"]; } } if (!isset($expected) || Composer\InstalledVersions::getReference("argws/asaas-sdk-php") !== $expected) { throw new RuntimeException("SDK diferente do lock validado"); }'
          composer check-platform-reqs --no-dev
      - name: Empacotar módulo
        run: |
          mkdir -p dist/asaas
          rsync -a ./ dist/asaas/ --exclude=/dist --exclude=/.git --exclude=/.github --exclude=/tests --exclude=/phpunit.xml --exclude=/.phpunit.cache --exclude=/.phpunit.result.cache
          printf '%s\n' "${GITHUB_SHA}" > dist/asaas/BUILD-COMMIT.txt
          cd dist
          zip -qr asaas-module-candidate.zip asaas
          sha256sum asaas-module-candidate.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: asaas-module-candidate-${{ github.sha }}
          path: |
            dist/asaas-module-candidate.zip
            dist/SHA256SUMS.txt
          retention-days: 30
